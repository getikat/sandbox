<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Ikat</title>
    <meta
      name="description"
      content="Your whole financial picture, in one place."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="theme-color"
      content="#0A0B0E"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#F7F7F5"
      media="(prefers-color-scheme: light)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <script>
      // Resolve the theme before first paint, so dark-mode users never see a white flash.
      (function () {
        try {
          var pref = localStorage.getItem("ikat.theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (localStorage.getItem("ikat.privacy") === "1")
            document.documentElement.classList.add("privacy");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
